server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El mime.types por defecto de nginx no incluye ".mjs" (cae a
    # application/octet-stream) — MapLibre GL sirve su web worker como
    # maplibre-gl-worker.mjs, y con ese Content-Type los navegadores
    # rechazan instanciarlo como módulo: el worker nunca arranca y el mapa
    # se queda en negro (sin capas de estilo ni clusters por GL), aunque
    # los marcadores DOM normales sigan viéndose. Encontrado y arreglado en
    # la verificación de cierre de EPIC-7 con el navegador real.
    #
    # Ojo: NO se usa aquí un bloque "types { }" a nivel server, porque eso
    # reemplaza por completo la tabla de mime.types heredada del bloque
    # http (perdiendo el tipo de .css, .png, etc. para todo este server) —
    # en vez de eso, default_type dentro de un location acotado a ".mjs"
    # solo afecta a esa extensión, sin tocar el resto.
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    # Resolver embebido de Docker + variable en proxy_pass: sin esto, nginx
    # resuelve "backend" una sola vez al arrancar y cachea la IP para
    # siempre. El servicio backend tiene "restart: unless-stopped" y sin
    # healthcheck (ver docker-compose.yml), asi que puede reiniciarse con
    # una IP interna distinta sin que nginx se entere.
    resolver 127.0.0.11 valid=10s;

    # Proxy al backend dentro de la red de Docker Compose. El prefijo
    # "location /api/" de nginx hace match a cualquier profundidad de ruta
    # de forma nativa (a diferencia del proxy de desarrollo de Angular,
    # ver proxy.conf.json, que solo hacia match a un segmento con "/api/*"
    # y por eso rutas anidadas como /api/oil-stations/{id}/price-history no
    # se proxyaban correctamente).
    location /api/ {
        set $backend_upstream http://backend:8000;
        # Sin path tras la variable a propósito: cuando proxy_pass usa una
        # variable, nginx NO hace el reemplazo habitual del prefijo de
        # location por el path de proxy_pass — en vez de eso, si proxy_pass
        # no lleva path, añade la URI original tal cual. Con
        # "proxy_pass $backend_upstream/api/;" (bug real encontrado en la
        # verificación de cierre) el resultado era /api/api/facets contra
        # el backend (404 en todas las llamadas); sin el "/api/" aquí, la
        # URI original (ya incluye /api/...) llega intacta y correcta.
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La app no usa Angular Router (vista unica), pero se deja el fallback
    # SPA como cortesia por si en el futuro se introduce enrutado.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

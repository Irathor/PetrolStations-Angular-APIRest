@if (isLoadingPlaces) {
  <div
    class="search-loading"
    role="status" aria-live="polite">
    <i class="pi pi-spinner pi-spin" aria-hidden="true"></i>
    <span>Cargando</span>
  </div>
}

@if (places.length > 0) {
  <ul
    class="results-list">
    @for (place of places; track place) {
      <li
        class="results-item"
        [class.active]="place.id === selectedId"
        (click)="flyTo(place)">
        <span class="titulo">{{ place.text | titlecase }}</span>
        <p>
          {{ place.place_name }}
        </p>
        <button class="go-btn"
          [class.go-btn-active]="place.id === selectedId"
          (click)="getDirections(place)">Ir a</button>
      </li>
    }
  </ul>
}

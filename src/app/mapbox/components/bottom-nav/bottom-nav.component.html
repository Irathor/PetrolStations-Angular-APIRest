<nav class="bottom-nav" aria-label="Navegación principal">
  <button type="button" class="bottom-nav__item" (click)="explorar.emit()">
    <i class="pi pi-compass" aria-hidden="true"></i>
    <span>Explorar</span>
  </button>

  <button type="button" class="bottom-nav__item"
    [class.active]="nearMeActive"
    [attr.aria-pressed]="nearMeActive"
    (click)="nearMeToggle.emit()">
    <i class="pi pi-map-marker" aria-hidden="true"></i>
    <span>Cerca de mí</span>
  </button>

  <button type="button" class="bottom-nav__item"
    [class.active]="favoritesOnly"
    [attr.aria-pressed]="favoritesOnly"
    (click)="favoritesOnlyToggle.emit()">
    <i class="pi pi-star" aria-hidden="true"></i>
    <span>Favoritas</span>
  </button>

  <button type="button" class="bottom-nav__item"
    [disabled]="!hasActiveRoute"
    [attr.aria-disabled]="!hasActiveRoute"
    [attr.aria-label]="hasActiveRoute ? 'Ver ruta activa' : 'No hay ninguna ruta activa'"
    (click)="focusRoute.emit()">
    <i class="pi pi-directions" aria-hidden="true"></i>
    <span>Ruta</span>
  </button>
</nav>
